<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />

    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Compass</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://api.strem.io" crossorigin />
    <link rel="dns-prefetch" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=sentient@400,500,600,700,401,501,601,701&f[]=switzer@400,500,600,700&f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Vazirmatn:wght@100..900&family=Inter:wght@100..900&family=IBM+Plex+Sans:wght@100..700&family=Plus+Jakarta+Sans:wght@100..800&family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        background: var(--color-canvas, #111214);
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }
      #compass-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 280ms ease-out;
      }
      #compass-boot-chrome {
        position: fixed;
        top: 8px;
        right: 10px;
        display: flex;
        gap: 4px;
        z-index: 10000;
        -webkit-app-region: no-drag;
      }
      #compass-boot-chrome button {
        width: 32px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #878d9c;
        font: 12px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      #compass-boot-chrome button:hover {
        background: #1c1e25;
        color: #e9ecf2;
      }
      #compass-boot-chrome button[data-act="close"]:hover {
        background: #c0392b;
        color: #fff;
      }
      #compass-boot.gone {
        opacity: 0;
      }
      #compass-boot > svg {
        width: 96px;
        height: auto;
        color: #f5f5f5;
        filter: drop-shadow(0 10px 30px rgba(255, 255, 255, 0.16));
        transform-origin: center;
        animation:
          compassBootBob 2400ms ease-in-out infinite,
          compassBootGlow 2400ms ease-in-out infinite;
      }
      @keyframes compassBootBob {
        0% {
          transform: translateY(0) rotate(-2deg) scale(0.98);
        }
        25% {
          transform: translateY(-3px) rotate(0deg) scale(1);
        }
        50% {
          transform: translateY(0) rotate(2deg) scale(1.02);
        }
        75% {
          transform: translateY(-3px) rotate(0deg) scale(1);
        }
        100% {
          transform: translateY(0) rotate(-2deg) scale(0.98);
        }
      }
      @keyframes compassBootGlow {
        0%,
        100% {
          opacity: 0.78;
        }
        50% {
          opacity: 1;
        }
      }
      #root[data-startup-hidden] {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          var hdrOverlay = p.get("compass-overlay") === "1";
          if (p.get("compass-dj") === "1") {
            var bar = document.createElement("div");
            bar.id = "compass-boot-chrome";
            bar.innerHTML =
              '<button type="button" data-act="min" aria-label="Minimise">&#8211;</button>' +
              '<button type="button" data-act="close" aria-label="Close">&#10005;</button>';
            bar.addEventListener("click", function (event) {
              var act = event.target && event.target.getAttribute("data-act");
              if (!act) return;
              var api = window.__TAURI__ && window.__TAURI__.window;
              var win = api && api.getCurrentWindow && api.getCurrentWindow();
              if (!win) return;
              if (act === "min") win.minimize();
              else win.close();
            });
            document.addEventListener("DOMContentLoaded", function () {
              document.body.appendChild(bar);
            });
          }
          if (p.get("compass-modal") === "1" || hdrOverlay) {
            var s = document.createElement("style");
            s.textContent = "#compass-boot{display:none !important}";
            if (hdrOverlay) {
              s.textContent += "html,body,#root{background:transparent !important}";
            }
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="compass-boot">
      <svg viewBox="0 0 864 864" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M432 5a431 426.5 0 1 0 0 853a431 426.5 0 1 0 0-853Zm0 41a390 385.5 0 1 1 0 771a390 385.5 0 1 1 0-771Z" />
        <path d="M412 30h44v106h-44ZM412 725h44v110h-44ZM26 415h95v40H26ZM744 415h95v40h-95Z" />
        <path fill-rule="evenodd" d="M674 206 485 487 202 651 381 382ZM432 400a37 37 0 1 0 0 74a37 37 0 1 0 0-74Z" />
      </svg>
    </div>
    <div id="root" inert data-startup-hidden></div>
    <script>
      // Paint the saved poster before React or the animation player loads.
      try {
        var art = JSON.parse(localStorage.getItem('compass.custom-artwork.v1') || '{}').launch;
        if (art && /^[\w-]{1,80}$/.test(art.id) && typeof art.poster === 'string' && art.poster.length < 200000 && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(art.poster)) {
          var mark = document.querySelector('#compass-boot > svg');
          var custom = document.createElement('div');
          custom.id = 'compass-custom-boot-art';
          custom.style.cssText = 'position:relative;width:128px;height:128px';
          custom.setAttribute('aria-hidden', 'true');
          var poster = document.createElement('img');
          poster.src = art.poster; poster.alt = ''; poster.style.cssText = 'width:100%;height:100%;object-fit:contain';
          custom.appendChild(poster); mark.after(custom); mark.style.display = 'none';
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/boot-artwork.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
