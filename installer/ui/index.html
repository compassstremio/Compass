<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024, initial-scale=1" />
    <title>Compass Installer</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/modal.css" />
    <link rel="stylesheet" href="styles/motion.css" />
    <link rel="stylesheet" href="styles/cinema.css" />
    <link rel="stylesheet" href="styles/cinema-overlays.css" />
    <link rel="stylesheet" href="styles/cinema-flow.css" />
  </head>
  <body>
    <div class="hb-window" id="hb-window">
      <div class="cn-wall" id="cn-wall" aria-hidden="true"></div>
      <div class="cn-scrim" aria-hidden="true"></div>
      <div class="cn-drag"></div>

      <div class="hb-wincontrols" id="hb-wincontrols">
        <button class="hb-winbtn" id="hb-min" type="button" aria-label="Minimize">
          <svg viewBox="0 0 13 13" fill="none"><path d="M3 6.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        </button>
        <button class="hb-winbtn" id="hb-max" type="button" aria-label="Maximize">
          <svg viewBox="0 0 13 13" fill="none" class="hb-glyph-max"><rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.4" rx="1.2" /></svg>
          <svg viewBox="0 0 13 13" fill="none" class="hb-glyph-restore">
            <rect x="2.5" y="4.5" width="6" height="6" stroke="currentColor" stroke-width="1.4" rx="1" />
            <path d="M5 4.5V3a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5H9" stroke="currentColor" stroke-width="1.4" fill="none" />
          </svg>
        </button>
        <button class="hb-winbtn hb-winbtn-danger" id="hb-close" type="button" aria-label="Close installer">
          <svg viewBox="0 0 13 13" fill="none"><path d="M3.5 3.5l6 6M9.5 3.5l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        </button>
      </div>

      <main class="cn-stage" id="screen"></main>
      <span class="cn-version" id="hb-version"></span>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
