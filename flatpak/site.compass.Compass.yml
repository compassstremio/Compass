app-id: site.compass.Compass
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: compass

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/discord-ipc-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/compass/cargo
    CARGO_NET_OFFLINE: 'true'
    npm_config_cache: /run/build/compass/npm-cache
    CI: 'true'

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: libass
    buildsystem: autotools
    config-opts:
      - --libdir=/app/lib
      - --disable-static
      - --enable-shared
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        commit: e46aedea0a0d17da4c4ef49d84b94a7994664ab5

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Ddefault_library=shared
      - -Dtests=false
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=true
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dtests=false
      - -Dlua=disabled
      - -Djavascript=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        commit: e48ac7ce08462f5e33af6ef9deeac6fa87eef01e

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.06.09/yt-dlp
        sha256: e5d57466682cfa9d61e9cf7c8a4f09b00f4a62af37d3bbdc4bcffdf63615feac

  - name: compass
    buildsystem: simple
    build-commands:
      - node flatpak-node/pnpm-cli/bin/pnpm.cjs install --offline --frozen-lockfile --trust-lockfile
      - node node_modules/@tauri-apps/cli/tauri.js build --config src-tauri/tauri.flatpak.conf.json --no-bundle
      - install -Dm755 src-tauri/target/release/compass /app/bin/compass
      - install -Dm644 flatpak/site.compass.Compass.desktop /app/share/applications/site.compass.Compass.desktop
      - install -Dm644 flatpak/site.compass.Compass.metainfo.xml /app/share/metainfo/site.compass.Compass.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/site.compass.Compass.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/site.compass.Compass.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/site.compass.Compass.png
      - install -Dm755 /usr/bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 /usr/bin/ffprobe /app/bin/ffprobe
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - .flatpak-work
          - node_modules
          - dist
          - compass-core/target
          - src-tauri/target
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.16.1.tgz
        sha256: ca362a16f2e1c3cfa81d406f3242446179a0e4aea457ba3e9e6c39e6476aba65
        dest: flatpak-node/pnpm-cli
      - node-sources.json
      - cargo-sources.json
